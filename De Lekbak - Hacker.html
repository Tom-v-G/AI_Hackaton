  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 style=\"font-family:'Archivo',sans-serif; font-size:10px; letter-spacing:.12em; color:#5e7686;\">BUZZ<\u002Fspan><span style=\"font-size:26px; font-weight:800; color:var(--cy); text-shadow:0 0 12px rgba(63,214,224,.5);\">{{ hero.buzz }}<\u002Fspan><\u002Fdiv>\n                  <svg viewBox=\"0 0 180 28\" width=\"100%\" height=\"28\" preserveAspectRatio=\"none\" style=\"margin-top:8px;\"><polyline points=\"{{ hero.sparkPoints180 }}\" fill=\"none\" stroke=\"var(--cy)\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><\u002Fpolyline><\u002Fsvg>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- console rows -->\n            <div style=\"font-family:'Archivo',sans-serif; font-size:10px; letter-spacing:.14em; color:#5e7686; margin:22px 0 4px; display:grid; grid-template-columns:30px 80px 1fr 230px 96px 120px; gap:18px;\">\n              <span><\u002Fspan><span>RANG<\u002Fspan><span>DREIGING<\u002Fspan><span>SIGNALEN<\u002Fspan><span>BUZZ<\u002Fspan><span style=\"text-align:right;\">TREND<\u002Fspan>\n            <\u002Fdiv>\n            <sc-for list=\"{{ rest }}\" as=\"v\" hint-placeholder-count=\"4\">\n              <div style=\"display:grid; grid-template-columns:30px 80px 1fr 230px 96px 120px; gap:18px; align-items:center; padding:16px 0; border-top:1px solid var(--line);\">\n                <span style=\"width:9px; height:9px; border-radius:50%; background:{{ v.sevColor }}; box-shadow:0 0 8px {{ v.sevColor }}; justify-self:center;\"><\u002Fspan>\n                <span style=\"font-size:30px; font-weight:800; color:#3a4d5a;\">{{ v.rank }}<\u002Fspan>\n                <div>\n                  <div style=\"font-size:11px; color:#5e7686;\">{{ v.cve }} · <span style=\"color:{{ v.sevColor }}; font-weight:700;\">{{ v.severity }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"font-size:19px; font-weight:800; color:#dce8f0; margin-top:1px;\">{{ v.name }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px; color:#7d93a2; line-height:1.4; margin-top:3px;\">{{ v.summary }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:grid; gap:5px; font-family:'Archivo',sans-serif; font-size:11px;\">\n                  <div style=\"display:flex; justify-content:space-between; color:#5e7686;\"><span>NWS<\u002Fspan><span style=\"color:#cddbe5; font-weight:600;\">{{ v.newsDisp }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex; justify-content:space-between; color:#5e7686;\"><span>SOC<\u002Fspan><span style=\"color:#cddbe5; font-weight:600;\">{{ v.socialDisp }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex; justify-content:space-between; color:#5e7686;\"><span>RES<\u002Fspan><span style=\"color:#cddbe5; font-weight:600;\">{{ v.researchersDisp }}<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-size:24px; font-weight:800; color:#dce8f0;\">{{ v.buzz }}<\u002Fdiv>\n                  <div style=\"height:4px; background:#16222b; margin-top:5px; border-radius:2px;\"><div style=\"height:4px; border-radius:2px; background:var(--cy); width:{{ v.buzzPct }};\"><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"text-align:right; color:{{ v.trendColor }}; font-family:'Archivo',sans-serif; font-size:12px; font-weight:700;\">{{ v.trendSym }} {{ v.trendWord }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  buildView() {\n    const raw = [\n      { rank:1, cve:\"CVE-2026-1234\", name:\"CoffeeLeak\", buzz:87, trend:\"rising\",\n        news:12, social:2400, researchers:8, source:24, severity:\"CRITICAL\",\n        flags:[\"KEV\",\"PoC\"],\n        summary:\"Een fout in de sessie-afhandeling van de populaire reverse-proxy CoffeeProxy laat een aanvaller zonder in te loggen het geheugen uitlezen — inclusief tokens en wachtwoorden.\",\n        risk:\"publieke webservers met CoffeeProxy 3.x zonder de patch van gisteren.\",\n        spark:[18,26,24,39,55,72,87] },\n      { rank:2, cve:\"CVE-2026-0991\", name:\"Naamloos\", buzz:71, trend:\"rising\",\n        news:7, social:1600, researchers:6, source:15, severity:\"HIGH\",\n        flags:[\"PoC\"],\n        summary:\"Een lek in de PDF-render-engine van diverse mailclients voert code uit zodra een bijlage wordt voorvertoond — geen klik nodig.\",\n        risk:\"desktop-mailclients die bijlagen automatisch previewen.\",\n        spark:[30,34,33,47,52,65,71] },\n      { rank:3, cve:\"CVE-2026-2087\", name:\"GhostMTA\", buzz:64, trend:\"stable\",\n        news:9, social:900, researchers:5, source:18, severity:\"CRITICAL\",\n        flags:[\"KEV\"],\n        summary:\"Een verkeerd geconfigureerde standaardregel in een veelgebruikte mailserver laat onbekenden mail versturen namens jouw domein.\",\n        risk:\"beheerders van zelf-gehoste mailservers met de standaardconfig.\",\n        spark:[60,57,63,59,64,61,64] },\n      { rank:4, cve:\"CVE-2026-1450\", name:\"Naamloos\", buzz:52, trend:\"cooling\",\n        news:5, social:1100, researchers:3, source:11, severity:\"MEDIUM\",\n        flags:[\"PoC\"],\n        summary:\"Een lek in een wijdverspreide datum-bibliotheek laat een aanvaller via geprepareerde invoer de server laten vastlopen.\",\n        risk:\"Node-backends die invoer direct doorgeven aan de bibliotheek.\",\n        spark:[80,74,69,63,58,55,52] },\n      { rank:5, cve:\"CVE-2025-9982\", name:\"LoopHole\", buzz:41, trend:\"cooling\",\n        news:4, social:600, researchers:4, source:9, severity:\"HIGH\",\n        flags:[\"KEV\",\"PoC\"],\n        summary:\"Een omzeiling van de tweestapsverificatie in een bekende VPN-appliance, al sinds vorige maand bekend maar nog volop besproken.\",\n        risk:\"organisaties met de VPN-appliance op de rand van hun netwerk.\",\n        spark:[66,60,57,52,48,44,41] },\n    ];\n\n    const fmtK = n => n >= 1000 ? (Math.round(n/100)/10).toString().replace(\".\", \",\") + \"k\" : String(n);\n    const maxNews = Math.max(...raw.map(v=>v.news));\n    const maxSocial = Math.max(...raw.map(v=>v.social));\n    const maxRes = Math.max(...raw.map(v=>v.researchers));\n\n    const trendMeta = {\n      rising:  { sym:\"▲\", word:\"rising\",  color:\"#ff7a45\" },\n      cooling: { sym:\"▼\", word:\"cooling\", color:\"#46d3e6\" },\n      stable:  { sym:\"→\", word:\"stable\",  color:\"#7fae93\" },\n    };\n    const sevColor = { CRITICAL:\"#ff5c5c\", HIGH:\"#ffb02e\", MEDIUM:\"#7fae93\", LOW:\"#7fae93\" };\n\n    const sparkPts = (arr, W, H) => {\n      const mn = Math.min(...arr), mx = Math.max(...arr), pad = 2.5;\n      return arr.map((v,i) => {\n        const x = (i/(arr.length-1)) * W;\n        const t = mx === mn ? 0.5 : (v-mn)/(mx-mn);\n        const y = (H-pad) - t*(H-pad*2);\n        return x.toFixed(1) + \",\" + y.toFixed(1);\n      }).join(\" \");\n    };\n    const asciiBar = (n, max, w) => {\n      const f = Math.max(0, Math.min(w, Math.round(n/max*w)));\n      return \"█\".repeat(f) + \"░\".repeat(w - f);\n    };\n\n    return raw.map(v => ({\n      ...v,\n      newsDisp: String(v.news),\n      socialDisp: fmtK(v.social),\n      researchersDisp: String(v.researchers),\n      newsPct: Math.round(v.news/maxNews*100) + \"%\",\n      socialPct: Math.round(v.social/maxSocial*100) + \"%\",\n      resPct: Math.round(v.researchers/maxRes*100) + \"%\",\n      buzzPct: v.buzz + \"%\",\n      newsBar: asciiBar(v.news, maxNews, 16),\n      socialBar: asciiBar(v.social, maxSocial, 16),\n      resBar: asciiBar(v.researchers, maxRes, 16),\n      trendSym: trendMeta[v.trend].sym,\n      trendWord: trendMeta[v.trend].word,\n      trendColor: trendMeta[v.trend].color,\n      sevColor: sevColor[v.severity] || \"#7fae93\",\n      flagsStr: v.flags.join(\", \"),\n      sparkPoints110: sparkPts(v.spark, 110, 26),\n      sparkPoints160: sparkPts(v.spark, 160, 30),\n      sparkPoints180: sparkPts(v.spark, 180, 28),\n    }));\n  }\n\n  componentDidMount() { this._startMatrix(0); }\n  componentWillUnmount() {\n    cancelAnimationFrame(this._raf);\n    if (this._mxFit) window.removeEventListener(\"resize\", this._mxFit);\n  }\n  _startMatrix(tries) {\n    const c = this._mx;\n    if (!c || !c.parentElement || !c.parentElement.offsetWidth) {\n      if (tries < 40) setTimeout(() => this._startMatrix(tries + 1), 60);\n      return;\n    }\n    const ctx = c.getContext(\"2d\");\n    const fs = 14;\n    const glyphs = \"アカサタナハマヤラワ0123456789ABCDEF<>=/\\\\$#*+｜:\".split(\"\");\n    const fit = () => { const p = c.parentElement; c.width = p.offsetWidth; c.height = p.offsetHeight; };\n    fit();\n    let cols = Math.floor(c.width / fs);\n    let drops = Array(cols).fill(0).map(() => Math.random() * -60);\n    let last = 0;\n    const step = (t) => {\n      this._raf = requestAnimationFrame(step);\n      if (t - last < 58) return;\n      last = t;\n      ctx.fillStyle = \"rgba(2,6,4,0.16)\";\n      ctx.fillRect(0, 0, c.width, c.height);\n      ctx.font = fs + \"px monospace\";\n      for (let i = 0; i < cols; i++) {\n        const ch = glyphs[Math.floor(Math.random() * glyphs.length)];\n        const x = i * fs, y = drops[i] * fs;\n        ctx.fillStyle = Math.random() < 0.035 ? \"#d6ffe5\" : \"rgba(45,210,110,0.5)\";\n        ctx.fillText(ch, x, y);\n        if (y > c.height && Math.random() > 0.975) drops[i] = 0;\n        drops[i]++;\n      }\n    };\n    this._raf = requestAnimationFrame(step);\n    this._mxFit = () => { fit(); cols = Math.floor(c.width / fs); drops = Array(cols).fill(0).map(() => Math.random() * -60); };\n    window.addEventListener(\"resize\", this._mxFit);\n  }\n\n  renderVals() {\n    const view = this.buildView();\n    return {\n      hero: view[0],\n      rest: view.slice(1),\n      all: view,\n      setMx: (el) => { this._mx = el; },\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
