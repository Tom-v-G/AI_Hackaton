[project]
name = "de-lekbak-backend"
version = "0.1.0"
description = "Standalone viral CVE dashboard API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<0.137",
    "uvicorn[standard]>=0.32.0,<0.47",
    "pydantic>=2.10.0,<2.14",
    "pydantic-settings>=2.6.0,<2.15",
    "httpx>=0.28.0,<0.29",
    "sqlalchemy[asyncio]>=2.0.0,<2.1",
    "asyncpg>=0.30.0,<0.31",
    "alembic>=1.14.0,<1.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.1",
    "ruff>=0.8.0,<0.15.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.1",
    "ruff>=0.8.0,<0.15.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["de_lekbak_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
