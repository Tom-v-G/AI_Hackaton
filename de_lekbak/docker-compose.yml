services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: de_lekbak
      POSTGRES_PASSWORD: de_lekbak
      POSTGRES_DB: de_lekbak
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U de_lekbak -d de_lekbak"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
